name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show environment
        run: |
          xcodebuild -version
          xcodebuild -project carkey.xcodeproj -list

      - name: Build carkey (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project carkey.xcodeproj \
            -scheme carkey \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            VALIDATE_PRODUCT=NO \
            ONLY_ACTIVE_ARCH=NO \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 \
            -quiet 2>&1 | tail -80

      - name: Package into IPA
        run: |
          ls -la build/Build/Products/Release-iphoneos/
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "carkey.app" | head -1)
          echo "found app: $APP"
          test -n "$APP" || { echo "ERROR: carkey.app not found"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry BaJunKey.ipa Payload
          ls -lh BaJunKey.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BaJunKey-ipa
          path: BaJunKey.ipa
          retention-days: 7
